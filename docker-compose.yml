version: "3.8"

services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: desidhar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desidhar_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-desidhar_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - desidhar_network

  # ==========================================
  # 2. Redis Cache & Sessions Service
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: desidhar_redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-redispassword} 
      --appendonly yes 
      --maxmemory 512mb 
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - desidhar_network

  # ==========================================
  # 3. FastAPI Backend API Service
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desidhar_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "DesiDhar D2C Store API"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      API_V1_STR: "/api/v1"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-desidhar_db}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-production-key-at-least-32-chars-long-2026}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      COOKIE_SECURE: "false" # Set to true behind HTTPS reverse proxy (Traefik/Nginx)
      COOKIE_SAMESITE: "lax"
      FIRST_SUPER_ADMIN_EMAIL: ${FIRST_SUPER_ADMIN_EMAIL:-admin@desidhar.com}
      FIRST_SUPER_ADMIN_PASSWORD: ${FIRST_SUPER_ADMIN_PASSWORD:-SuperAdmin@2026!}
      FIRST_SUPER_ADMIN_FIRST_NAME: "Super"
      FIRST_SUPER_ADMIN_LAST_NAME: "Admin"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-rzp_webhook_secret_placeholder}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - desidhar_network

# ==========================================
# Named Volumes & Networks
# ==========================================
volumes:
  postgres_data:
    name: desidhar_postgres_data
  redis_data:
    name: desidhar_redis_data

networks:
  desidhar_network:
    name: desidhar_network
    driver: bridge
